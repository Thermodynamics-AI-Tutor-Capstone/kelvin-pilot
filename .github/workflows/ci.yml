name: Pilot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate Compose configuration
        run: |
          ./scripts/init-gb10.sh
          sed -i 's/^GB10_SHARED_NETWORK=.*/GB10_SHARED_NETWORK=gb10-ci/' .env
          docker compose config --quiet
      - name: Build pilot image
        run: docker build -t kelvin-pilot:ci .
