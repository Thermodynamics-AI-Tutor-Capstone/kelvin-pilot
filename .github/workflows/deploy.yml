name: Test and deploy Kelvin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kelvin-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: vars.CI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public-mcp
            directory: .
            project: prj_lH05HawLc4yRn0qNl4FFKPthyCyT
          - name: account-mcp
            directory: .
            project: prj_5bKGSo1WK2QGsRgjIvpLJhFhVklh
          - name: professor-dashboard
            directory: dashboard
            project: prj_Med7HgJJ7k8LUuolLI1skejvYYjA
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_rMoj1lNflIwVxJhItt4bIKan
      VERCEL_PROJECT_ID: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'Set the VERCEL_TOKEN repository Actions secret before deploying.' >&2
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@65.11.0
      - name: Build and deploy
        working-directory: ${{ matrix.directory }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
